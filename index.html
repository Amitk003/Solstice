<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solstice</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #e8edf3;
        font-family: system-ui, sans-serif;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: calc(100vw - 24px);
        box-sizing: border-box;
        padding: 8px 12px;
        background: rgba(11, 15, 20, 0.7);
        border: 1px solid #2a3442;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      #panel {
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        max-width: calc(100vw - 24px);
        max-height: 45vh;
        box-sizing: border-box;
        padding: 8px 12px;
        overflow-y: auto;
        background: rgba(11, 15, 20, 0.7);
        border: 1px solid #2a3442;
        border-radius: 6px;
        font-size: 14px;
      }
      #panel label,
      #panel span,
      #panel button {
        margin-left: 0 !important;
      }
      #panel input[type='range'] {
        max-width: 35vw;
      }
      @media (max-width: 640px) {
        #status {
          top: 8px;
          left: 8px;
          max-width: calc(100vw - 16px);
          font-size: 12px;
          padding: 6px 10px;
        }
        #panel {
          left: 8px;
          right: 8px;
          bottom: 8px;
          max-width: calc(100vw - 16px);
          padding: 6px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">Starting WebGPU...</div>
    <div id="panel">
      <label><input type="checkbox" id="bounceToggle" checked /> Indirect bounce</label>
      <label style="margin-left: 12px"><input type="checkbox" id="denoiseToggle" checked /> Denoise</label>
      <label style="margin-left: 12px"><input type="checkbox" id="autoOrbitToggle" /> Auto orbit</label>
      <span style="margin-left: 12px">Keys 1/2/3/4/5/6: shaded, normal, depth, albedo, roughness, emission</span>
      <label style="margin-left: 12px"
        >Scale
        <select id="resSelect">
          <option value="auto">Auto</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1" selected>100%</option>
        </select>
      </label>
      <label style="margin-left: 12px"
        >Aperture
        <input type="range" id="apertureRange" min="0" max="0.2" step="0.005" value="0.04" />
      </label>
      <label style="margin-left: 12px"
        >Focus
        <input type="range" id="focusRange" min="-2" max="4" step="0.05" value="0" />
      </label>
      <label style="margin-left: 12px"
        >Sun size
        <input type="range" id="sunRange" min="0" max="0.3" step="0.01" value="0.05" />
      </label>
      <label style="margin-left: 12px"
        >Sun angle
        <input type="range" id="sunAngleRange" min="-180" max="180" step="1" value="-45" />
      </label>
      <label style="margin-left: 12px"
        >Sun height
        <input type="range" id="sunHeightRange" min="2" max="89" step="1" value="55" />
      </label>
      <label style="margin-left: 12px"
        >Key light
        <input type="range" id="keyLightRange" min="0" max="3" step="0.05" value="1" />
      </label>
      <label style="margin-left: 12px"
        >Fill light
        <input type="range" id="fillLightRange" min="0" max="3" step="0.05" value="1" />
      </label>
      <label style="margin-left: 12px"
        >Sky
        <input type="range" id="skyRange" min="0" max="2" step="0.05" value="1" />
      </label>
      <label style="margin-left: 12px"
        >Exposure
        <input type="range" id="exposureRange" min="0.1" max="4" step="0.05" value="1.2" />
      </label>
      <label style="margin-left: 12px"
        >Tone
        <select id="toneSelect">
          <option value="0" selected>ACES</option>
          <option value="1">Reinhard</option>
          <option value="2">Linear</option>
        </select>
      </label>
      <label style="margin-left: 12px"><input type="checkbox" id="vignetteToggle" /> Vignette</label>
      <span style="margin-left: 12px">
        <button class="presetButton" type="button" data-preset="0">Home</button>
        <button class="presetButton" type="button" data-preset="1">Front</button>
        <button class="presetButton" type="button" data-preset="2">Top</button>
        <button class="presetButton" type="button" data-preset="3" style="margin-right: 12px">Low</button>
      </span>
      <button id="saveButton" type="button">Save PNG</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
